title: Ardulink-2
description: A complete, open source, Java solution for the control and coordination of Arduino boards
url: "http://ardulink.org"
baseurl: ""

remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag

aux_links:
  "GitHub":
    - "https://github.com/Ardulink/Ardulink-2"
  "Maven Central":
    - "https://search.maven.org/#search%7Cga%7C1%7Cg%3A%22org.ardulink%22"

aux_links_new_tab: true

nav_enabled: true

heading_anchors: true

back_to_top: true
back_to_top_text: "Back to top"

footer_content: >-
  Ardulink-2 is released under the
  <a href="https://github.com/Ardulink/Ardulink-2/blob/master/LICENSE">Apache 2.0 License</a>.
  Hosted on <a href="https://pages.github.com">GitHub Pages</a>.

color_scheme: dark

search_enabled: true
search:
  heading_level: 2
  previews: 2
  preview_words_before: 5
  preview_words_after: 10

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
